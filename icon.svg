<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 可爱装饰圆点 -->
  <circle cx="400" cy="110" r="20" fill="#67e8f9" opacity="0.5"/>
  <circle cx="110" cy="400" r="14" fill="#a5f3fc" opacity="0.4"/>
  <!-- 白色卡片 -->
  <rect x="120" y="130" width="272" height="252" rx="28" fill="url(#card)" stroke="#bae6fd" stroke-width="3"/>
  <!-- 标题栏 -->
  <rect x="120" y="130" width="272" height="56" rx="28" fill="#0891b2"/>
  <rect x="120" y="158" width="272" height="28" fill="#0891b2"/>
  <!-- 三个圆点装饰 -->
  <circle cx="150" cy="158" r="7" fill="#fef3c7"/>
  <circle cx="174" cy="158" r="7" fill="#a7f3d0"/>
  <circle cx="198" cy="158" r="7" fill="#fbcfe8"/>
  <!-- 检查清单线条 -->
  <rect x="148" y="212" width="180" height="10" rx="5" fill="#bae6fd"/>
  <rect x="148" y="238" width="140" height="10" rx="5" fill="#e0f2fe"/>
  <rect x="148" y="264" width="200" height="10" rx="5" fill="#e0f2fe"/>
  <rect x="148" y="290" width="120" height="10" rx="5" fill="#e0f2fe"/>
  <!-- 勾选标记 -->
  <circle cx="148" cy="338" r="16" fill="#10b981"/>
  <path d="M140 338 L146 344 L157 332" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="172" y="330" width="100" height="10" rx="5" fill="#bae6fd"/>
  <!-- 底部装饰 -->
  <text x="256" y="430" font-family="sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle" opacity="0.9">QMS</text>
</svg>
